site_name: Evan's Docs
site_url: https://evahhumphry.com/mysite
theme:
  features:
    - navigation.tabs
    - navigation.indexes
    - navigation.expand
  name: material
  palette:
    scheme: slate
    primary: blue
    accent: deep purple
extra_css:
  - stylesheets/extra.css
extra_javascript:
  - javascripts/extra.js
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true
nav:
  - Home: index.md
  - CCNA:
    - Network Fundamentals: ccna/fundamentals.md
    - IP Addressing & Subnetting: ccna/ip-addressing.md
    - Switching: ccna/switching.md
    - Routing: ccna/routing.md
    - OSPF: ccna/ospf.md
    - ACLs: ccna/acls.md
    - WAN Technologies: ccna/wan.md
    - Security: ccna/security.md
    - Network Services: ccna/network-services.md
    - Wireless: ccna/wireless.md
    - Commands Reference: ccna/commands.md
  - Cisco Telephony:
